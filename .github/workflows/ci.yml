name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm test
      - name: Integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:vscode
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
